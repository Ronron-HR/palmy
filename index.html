<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1f3a2e" />

    <!-- Skrifttyper: <link> i stedet for CSS @import, så browseren finder dem
         med det samme (ikke først efter CSS-bundtet er hentet og parset). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Forudindlæs LCP-hero (rette responsive variant vælges af browseren) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/palmy-hero-1200.webp"
      imagesrcset="/images/palmy-hero-800.webp 800w, /images/palmy-hero-1200.webp 1200w, /images/palmy-hero-1600.webp 1600w"
      imagesizes="100vw"
    />

    <!-- SEO-BLOK: erstattes pr. rute af scripts/prerender.mjs ved build
         (kilde: src/seo.js). Værdierne herunder er forsidens og bruges kun i
         dev-serveren. Ret i src/seo.js — ikke her. -->
    <!--seo:start-->
    <title>Palmy Spisested | Vietnamesisk restaurant i Hjortshøj</title>
    <meta
      name="description"
      content="Palmy Spisested i Hjortshøj serverer frisklavet vietnamesisk mad. Se menuen, find åbningstider og ring og bestil takeaway – vi har åbent fredag og lørdag."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.palmyspisested.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Palmy Spisested" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:title" content="Palmy Spisested | Vietnamesisk restaurant i Hjortshøj" />
    <meta
      property="og:description"
      content="Palmy Spisested i Hjortshøj serverer frisklavet vietnamesisk mad. Se menuen, find åbningstider og ring og bestil takeaway – vi har åbent fredag og lørdag."
    />
    <meta property="og:url" content="https://www.palmyspisested.com/" />
    <meta property="og:image" content="https://www.palmyspisested.com/images/palmy-hero-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Cloudflare Web Analytics — cookieless, kræver ikke consent-banner.
         INDSÆT TOKEN: Cloudflare-dashboard → Web Analytics → tilføj dette site
         → kopiér token ind nedenfor (erstat REPLACE_WITH_TOKEN). Uden en gyldig
         token opsamles ingen data. Alternativt kan Web Analytics slås til på
         selve Cloudflare Pages-projektet, som auto-injicerer beacon'en. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "REPLACE_WITH_TOKEN"}'
    ></script>
  </body>
</html>
